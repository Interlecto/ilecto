<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Key Assign</title>
  <desc id="desc">Four charcoal computer keys in two rows, the second row shifted a quarter key to the right like a real keyboard, labeled K at, Y colon, A, and S sigma.</desc>
  <defs>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#666b73"/>
      <stop offset="1" stop-color="#454a52"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#111820" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="92" fill="#252a31"/>
  <g filter="url(#shadow)" stroke="#858b94" stroke-width="2">
    <g transform="translate(32 72)">
      <rect width="192" height="176" rx="24" fill="url(#key)"/>
      <rect x="9" y="9" width="174" height="158" rx="17" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="96" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#ffffff">K<tspan fill="#ed4b50" font-size="53">@</tspan></text>
    </g>
    <g transform="translate(240 72)">
      <rect width="192" height="176" rx="24" fill="url(#key)"/>
      <rect x="9" y="9" width="174" height="158" rx="17" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="96" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#ffffff">Y<tspan fill="#ed4b50" font-size="58">ː</tspan></text>
    </g>
    <g transform="translate(80 264)">
      <rect width="192" height="176" rx="24" fill="url(#key)"/>
      <rect x="9" y="9" width="174" height="158" rx="17" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="96" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="700" fill="#ffffff">A</text>
    </g>
    <g transform="translate(288 264)">
      <rect width="192" height="176" rx="24" fill="url(#key)"/>
      <rect x="9" y="9" width="174" height="158" rx="17" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="96" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#ffffff">S<tspan fill="#ed4b50" font-size="54">Σ</tspan></text>
    </g>
  </g>
</svg>
